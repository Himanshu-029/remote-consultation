spring.application.name=remote-consultation

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/remote_consultation?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC / HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# SQL initialization
spring.sql.init.mode=never

# Server
server.port=8080

# Session security
server.servlet.session.timeout=15m


# Error response security
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Session cookie security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Disable server identification in error pages
server.server-header=
